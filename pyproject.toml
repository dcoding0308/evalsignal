[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "evalsignal"
version = "0.1.0"
description = "Is an AI change a real improvement or just noise? Paired statistics for model evaluations."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Devansh Raina" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.scripts]
evalsignal = "evalsignal.cli:main"

[dependency-groups]
dev = [
    "pyarrow>=17",
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evalsignal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: statistical simulation tests (seconds, not milliseconds)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/evalsignal"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
